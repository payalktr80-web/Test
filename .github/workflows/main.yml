name: Web Desktop (noVNC + Cloudflare)

on:
  workflow_dispatch:

jobs:
  web-desktop:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Install TightVNC and Cloudflared
        shell: powershell
        run: |
          # Install TightVNC Server with password set to 'admin123'
          choco install tightvnc -y --installargs '/quiet /norestart ADDLOCAL="Server" SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=admin123 SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=0'
          
          # Install Cloudflared
          choco install cloudflared -y

      - name: Setup noVNC and Websockify
        shell: powershell
        run: |
          # Clone noVNC directly using git
          git clone --depth 1 https://github.com C:\noVNC

          # Install websockify
          python -m pip install --upgrade pip
          python -m pip install websockify

      - name: Start Services and Cloudflare Tunnel
        shell: powershell
        run: |
          # Refresh environment variables
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # 1. Start TightVNC Service
          Start-Service tvnserver

          # 2. Start websockify in THIS same step so GitHub Actions does not kill it
          Start-Process -NoNewWindow -FilePath "python" -ArgumentList "-m websockify --web C:\noVNC 0.0.0.0:6080 127.0.0.1:5900"
          Start-Sleep -Seconds 5

          # 3. Start cloudflared pointing explicitly to 127.0.0.1:6080
          Start-Process -NoNewWindow -FilePath "cloudflared" -ArgumentList "tunnel --url http://127.0.0.1:6080 --logfile C:\cf.log"
          
          Write-Host "Waiting for Cloudflare Tunnel URL..."
          Start-Sleep -Seconds 10
          
          # Extract and display the clickable URL
          $logContent = Get-Content "C:\cf.log" -Raw
          if ($logContent -match "(https://[a-zA-Z0-9-]+\.trycloudflare\.com)") {
              $url = $matches
              Write-Host "=========================================================="
              Write-Host "OPEN THIS LINK IN YOUR BROWSER:"
              Write-Host "$url/vnc.html"
              Write-Host "VNC PASSWORD: admin123"
              Write-Host "=========================================================="
          } else {
              Write-Host "Could not find URL automatically. Check full log below:"
              Get-Content "C:\cf.log"
          }

          # Keep both websockify and cloudflared alive for up to 5.5 hours
          Start-Sleep -Seconds 19800
          

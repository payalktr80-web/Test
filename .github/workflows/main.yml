name: Web Desktop (noVNC + Cloudflare)

on:
  workflow_dispatch:

jobs:
  web-desktop:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Install TightVNC, Python, and Cloudflared
        shell: powershell
        run: |
          # Install TightVNC Server with password set to 'admin123'
          choco install tightvnc -y --installargs '/quiet /norestart ADDLOCAL="Server" SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=admin123 SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=0'
          
          # Install Python (for websockify) and Cloudflared
          choco install python cloudflared -y

      - name: Setup noVNC and Start Web Bridge
        shell: powershell
        run: |
          # Download noVNC
          Invoke-WebRequest -Uri "https://github.com" -OutFile "C:\novnc.zip"
          Expand-Archive -Path "C:\novnc.zip" -DestinationPath "C:\" -Force
          Rename-Item -Path "C:\noVNC-1.5.0" -NewName "noVNC"

          # Refresh environment variables so Python is recognized
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          # Install websockify
          pip install websockify

          # Start TightVNC Service
          Start-Service tvnserver

          # Start websockify in the background on port 6080 pointing to VNC port 5900
          Start-Process -NoNewWindow -FilePath "python" -ArgumentList "-m websockify --web C:\noVNC 6080 localhost:5900"
          Start-Sleep -Seconds 5

      - name: Start Cloudflare Tunnel and Keep Alive
        shell: powershell
        run: |
          # Start cloudflared and log output to a file so we can extract the URL
          Start-Process -NoNewWindow -FilePath "cloudflared" -ArgumentList "tunnel --url http://localhost:6080 --logfile C:\cf.log"
          
          Write-Host "Waiting for Cloudflare Tunnel URL..."
          Start-Sleep -Seconds 10
          
          # Extract and display the clickable URL
          $logContent = Get-Content "C:\cf.log" -Raw
          if ($logContent -match "(https://[a-zA-Z0-9-]+\.trycloudflare\.com)") {
              $url = $matches[1]
              Write-Host "=========================================================="
              Write-Host "OPEN THIS LINK IN YOUR BROWSER:"
              Write-Host "$url/vnc.html"
              Write-Host "VNC PASSWORD: admin123"
              Write-Host "=========================================================="
          } else {
              Write-Host "Could not find URL automatically. Check full log below:"
              Get-Content "C:\cf.log"
          }

          # Keep the runner alive for up to 5.5 hours
          Start-Sleep -Seconds 19800
          
